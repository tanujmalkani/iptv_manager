<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPTV Manager</title>
  <link rel="stylesheet" href="/frontend/styles.css">
  <link rel="stylesheet" href="/frontend/campaign.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <h1>IPTV Manager</h1>
        <p>Fast-zap stream performance dashboard</p>
      </div>
      <div class="actions">
        <select id="playlist" aria-label="Source playlist"><option value="">Select playlist…</option></select>
        <select id="optimization" aria-label="Export optimization">
          <option value="">Original</option>
          <option value="fast" selected>Fast</option>
          <option value="reliable">Reliable</option>
          <option value="all">All</option>
        </select>
        <select id="profile" aria-label="Playlist profile"><option value="">Input playlist</option></select>
        <label class="inline-setting" title="Number of streams tested at the same time">
          <span>Workers</span>
          <select id="test-concurrency" aria-label="Test concurrency">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="4" selected>4</option>
            <option value="8">8</option>
            <option value="16">16</option>
          </select>
        </label>
        <button id="save-profile" disabled>Save Profile</button>
        <button id="test" disabled>Quick Test</button>
        <button id="deep-test" disabled>Deep Test</button>
        <button id="export" disabled>Export M3U</button>
        <button id="refresh">Refresh</button>
      </div>
    </header>

    <section id="status" class="status">Loading playlists…</section>
    <section class="playlist-summary"><strong id="playlist-summary">Select a source playlist</strong><span id="channel-count" class="meta">0 channels</span></section>

    <section id="profile-editor" class="panel profile-editor" hidden>
      <div class="panel-title">
        <div><h2>Custom playlist</h2><p class="meta">Select channels and use ↑ / ↓ to set their export order.</p></div>
        <input id="profile-name" type="text" maxlength="255" placeholder="Profile name…">
      </div>
      <div id="profile-channels" class="profile-channel-list"></div>
    </section>

    <section id="optimization-preview" class="panel optimization-preview" hidden>
      <div class="panel-title">
        <div>
          <h2>Optimization plan</h2>
          <p id="optimization-summary" class="meta"></p>
        </div>
        <button id="refresh-optimization" type="button">Refresh Plan</button>
      </div>
      <div id="optimization-policy" class="optimization-policy"></div>
      <div id="optimization-channels" class="optimization-channel-list"></div>
    </section>

    <section id="export-preview" class="panel export-preview" hidden>
      <div class="panel-title">
        <div>
          <h2>Export validation</h2>
          <p id="export-preview-summary" class="meta"></p>
        </div>
        <div class="export-preview-actions">
          <button id="export-cancel" type="button">Cancel</button>
          <button id="export-confirm" type="button">Export M3U</button>
        </div>
      </div>
      <div id="export-preview-metrics" class="export-preview-metrics"></div>
      <div id="export-preview-warnings" class="export-preview-warnings"></div>
    </section>

    <section id="test-progress" class="progress" hidden>
      <div class="progress-head">
        <div><strong id="test-progress-label">Stream test</strong><span id="test-progress-count" class="meta"></span></div>
        <button id="test-cancel" class="danger" type="button" hidden>Cancel Test</button>
      </div>
      <div class="progress-track"><div id="test-progress-bar" class="progress-bar"></div></div>
    </section>

    <section class="layout">
      <aside class="panel">
        <div class="panel-title">
          <h2>Channels</h2>
          <input id="filter" type="search" placeholder="Filter channels…" autocomplete="off">
        </div>
        <div id="channels" class="channel-list"></div>
      </aside>
      <section class="panel detail">
        <div id="empty" class="empty">Select a channel to inspect its stream rankings.</div>
        <div id="channel-detail" hidden></div>
      </section>
    </section>
  </main>
  <script src="/frontend/export-preview.js"></script>
  <script src="/frontend/campaign.js"></script>
  <script src="/frontend/app.js"></script>
  <script src="/frontend/optimization.js"></script>
  <script src="/frontend/profile-mode.js"></script>
</body>
</html>
